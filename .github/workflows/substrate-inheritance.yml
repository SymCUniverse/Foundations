name: Substrate Inheritance Synthetic Validation

on:
  push:
    branches:
      - substrate-inheritance
    paths:
      - "substrate_inheritance/**"
      - ".github/workflows/substrate-inheritance.yml"
      - "README.md"
  pull_request:
    branches:
      - substrate-inheritance
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Install pinned validation dependencies
        run: |
          python -m pip install --disable-pip-version-check -r substrate_inheritance/requirements-validation.txt
          python -m pip check

      - name: Record realized validation environment
        run: |
          mkdir -p substrate_inheritance/results
          {
            python --version
            python -m pip --version
            python -m pip freeze --all | sort
          } > substrate_inheritance/results/validation_environment.txt
          cat substrate_inheritance/results/validation_environment.txt

      - name: Run adversarial unit and benchmark tests
        run: python -m pytest -q substrate_inheritance/test_*.py

      - name: Run synthetic inheritance validation
        run: python substrate_inheritance/inheritance_engine.py

      - name: Run ground-truth benchmark battery
        run: python -m substrate_inheritance.ground_truth_benchmarks

      - name: Run ensemble falsification validation
        run: python -m substrate_inheritance.ensemble_validation

      - name: Run identifiability validation
        run: python -m substrate_inheritance.identifiability_validation

      - name: Run coordinate and degeneracy robustness validation
        run: python -m substrate_inheritance.robustness_validation

      - name: Run substrate-depth embedding validation
        run: python -m substrate_inheritance.depth_validation

      - name: Run carrier discriminability-strength sweep
        run: python -m substrate_inheritance.discriminability_validation

      - name: Run non-normal biorthogonal carrier validation
        run: python -m substrate_inheritance.nonnormal_validation

      - name: Run separate electronic inheritance validation
        run: python -m substrate_inheritance.electronic_validation

      - name: Run real-system adapter validation record
        run: python -m substrate_inheritance.adapter_validation

      - name: Run SI-next candidate architecture validation
        run: python -m substrate_inheritance.si_next_validation

      - name: Run SI-next diagnostic contract validation
        run: python -m substrate_inheritance.si_next_contract_validation

      - name: Verify outputs are explicitly non-physical
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          expected = {
              "synthetic_validation.json": "synthetic_software_validation_only",
              "ground_truth_benchmarks.json": "synthetic_ground_truth_benchmark_only",
              "ensemble_validation.json": "synthetic_ensemble_validation_only",
              "identifiability_validation.json": "synthetic_identifiability_validation_only",
              "robustness_validation.json": "synthetic_robustness_validation_only",
              "depth_validation.json": "synthetic_inheritance_depth_validation_only",
              "discriminability_validation.json": "synthetic_discriminability_strength_validation_only",
              "nonnormal_validation.json": "synthetic_nonnormal_biorthogonal_validation_only",
              "electronic_validation.json": "synthetic_electronic_inheritance_validation_only",
              "adapter_validation.json": "synthetic_real_system_adapter_validation_only",
              "si_next_validation.json": "synthetic_si_next_architecture_validation_only",
              "si_next_contract_validation.json": "synthetic_si_next_diagnostic_contract_validation_only",
          }
          records = {}
          for filename, scope in expected.items():
              record = json.loads(Path("substrate_inheritance/results", filename).read_text())
              assert record["scope"] == scope
              records[filename] = record

          assert records["ground_truth_benchmarks.json"]["case_count"] == 10
          for record in records.values():
              if "physical_thresholds_frozen" in record:
                  assert record["physical_thresholds_frozen"] is False
              if "real_system_evidence" in record:
                  assert record["real_system_evidence"] is False
          assert records["identifiability_validation.json"]["single_scalar_response_identifies_unique_coupling"] is False
          assert records["electronic_validation.json"]["mechanical_damping_inferred"] is False
          assert records["electronic_validation.json"]["electronic_hybridization_identified_with_mechanical_gamma"] is False
          adapter = records["adapter_validation.json"]["analysis"]
          assert adapter["physical_inheritance_threshold_applied"] is False
          assert adapter["inheritance_promotion_label_assigned"] is False
          assert adapter["chi_computed"] is False
          assert adapter["damping_computed"] is False

          si_next = records["si_next_validation.json"]
          assert si_next["status"] == "candidate_v0.3_non_authoritative"
          assert si_next["frozen_v0.2_changed"] is False
          assert si_next["inheritance_promotion_rule_changed"] is False
          assert si_next["lineage"]["exact_tie_refused"] is True
          assert si_next["lineage"]["split_effective_child_count"] > 1.0
          assert si_next["lineage"]["relative_flow_threshold_applied"] is False
          assert si_next["multi_parent"]["effects_forced_to_sum_to_one"] is False
          assert si_next["multi_parent"]["mobius_reconstruction_residual_norm"] < 1e-12
          assert si_next["multi_parent"]["mobius_evaluation_count"] == 8

          contract = records["si_next_contract_validation.json"]
          assert contract["status"] == "candidate_v0.3_non_authoritative"
          contract_analysis = contract["analysis"]
          assert contract_analysis["physical_inheritance_threshold_applied"] is False
          assert contract_analysis["inheritance_promotion_label_assigned"] is False
          assert contract_analysis["v0_2_result_overridden"] is False
          assert contract_analysis["physical_inheritance_claim"] is False
          assert contract_analysis["multi_parent"]["subset_manifest_complete"] is True
          assert contract_analysis["multi_parent"]["exact_mobius_requested"] is True
          assert contract["refusal_checks"]["lineage_identifiability_without_uncertainty"] == "MISSING_LINEAGE_UNCERTAINTY"
          assert contract["refusal_checks"]["incomplete_exact_mobius"] == "INCOMPLETE_EXACT_MOBIUS"
          print("Synthetic evidence guards passed")
          PY

      - name: Upload synthetic validation records
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: substrate-inheritance-synthetic-validation
          path: |
            substrate_inheritance/results/synthetic_validation.json
            substrate_inheritance/results/ground_truth_benchmarks.json
            substrate_inheritance/results/ensemble_validation.json
            substrate_inheritance/results/identifiability_validation.json
            substrate_inheritance/results/robustness_validation.json
            substrate_inheritance/results/depth_validation.json
            substrate_inheritance/results/discriminability_validation.json
            substrate_inheritance/results/nonnormal_validation.json
            substrate_inheritance/results/electronic_validation.json
            substrate_inheritance/results/adapter_validation.json
            substrate_inheritance/results/si_next_validation.json
            substrate_inheritance/results/si_next_contract_validation.json
            substrate_inheritance/results/validation_environment.txt
